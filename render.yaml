services:
  - type: web
    name: factygo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: LLM_BASE_URL
        value: http://localhost:11434
      - key: LLM_MODEL
        sync: false
      - key: SEARCH_PROVIDER
        value: none
      - key: SEARCH_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
