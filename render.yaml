services:
  - type: web
    name: factygo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SEARCH_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000
